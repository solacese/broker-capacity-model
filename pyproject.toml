[project]
name = "broker-capacity-model"
version = "0.1.0"
description = "Solace PubSub+ inventory and resumable saturation experiments"
requires-python = ">=3.11"
dependencies = ["solace-pubsubplus>=1.9,<2", "psutil>=7,<8"]

[project.scripts]
broker-capacity = "broker_capacity.cli:main"
broker-capacity-pilot = "broker_capacity.pilot_cli:main"
broker-capacity-grid = "broker_capacity.grid:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/broker_capacity"]
